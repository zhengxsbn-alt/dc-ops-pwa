<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DC运维终端 · 移动端</title>
<meta name="theme-color" content="#0B1220">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #16233D 0%, #0B1220 55%, #060A12 100%);
    color: #E6EDF7; min-height: 100vh; padding: 28px 18px 40px;
    display:flex; flex-direction:column;
  }
  .head { text-align:center; margin: 8px 0 26px; }
  .badge {
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; letter-spacing:.08em; color:#7EA4D8;
    border:1px solid rgba(126,164,216,.35); border-radius:999px;
    padding:5px 12px; margin-bottom:16px;
  }
  .dot { width:6px; height:6px; border-radius:50%; background:#3DDC97; box-shadow:0 0 8px #3DDC97; }
  h1 { font-size:23px; font-weight:700; letter-spacing:.02em; }
  .sub { margin-top:8px; font-size:13px; color:#8FA3BF; }

  .cards { display:flex; flex-direction:column; gap:14px; }
  a.card {
    display:flex; align-items:center; gap:14px; text-decoration:none;
    background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 18px; padding: 18px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    transition: transform .15s ease, border-color .15s ease;
  }
  a.card:active { transform: scale(.98); border-color: rgba(96,165,250,.55); }
  .ico {
    width:46px; height:46px; border-radius:14px; flex:0 0 46px;
    display:flex; align-items:center; justify-content:center; font-size:21px;
  }
  .ico.blue  { background: linear-gradient(135deg,#1D4ED8,#3B82F6); }
  .ico.cyan  { background: linear-gradient(135deg,#0E7490,#22D3EE); }
  .ico.violet{ background: linear-gradient(135deg,#6D28D9,#A78BFA); }
  .meta { flex:1; }
  .meta .t { font-size:16px; font-weight:600; }
  .meta .d { font-size:12.5px; color:#8FA3BF; margin-top:4px; }
  .arrow { color:#5E7BA3; font-size:18px; }

  .tip {
    margin-top:26px; font-size:12.5px; line-height:1.7; color:#7A8DA8;
    border-top:1px solid rgba(255,255,255,.08); padding-top:18px;
  }
  .tip b { color:#B9CBE4; font-weight:600; }
  .foot { margin-top:auto; text-align:center; font-size:11.5px; color:#5E7BA3; padding-top:26px; }
</style>
</head>
<body>
  <div class="head">
    <div class="badge"><span class="dot"></span>MOBILE CONSOLE</div>
    <h1>DC运维终端</h1>
    <div class="sub">数据中心健康度评估 · 移动端工具集</div>
  </div>

  <div class="cards">
    <a class="card" href="./water/">
      <div class="ico blue">💧</div>
      <div class="meta">
        <div class="t">水系统健康度评估</div>
        <div class="d">冷冻水 / 冷却水 / 水处理系统巡检</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="./ahu/">
      <div class="ico cyan">🌀</div>
      <div class="meta">
        <div class="t">AHU 健康度评估</div>
        <div class="d">空气处理机组 / 末端空调巡检</div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="./site/">
      <div class="ico violet">🏢</div>
      <div class="meta">
        <div class="t">机房巡检</div>
        <div class="d">机房现场巡检与问题记录</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="tip">
    <b>使用说明：</b>三个工具均为离线优先的 PWA，数据保存在手机本地（IndexedDB），无需登录即可使用。<br>
    在浏览器菜单中选「添加到主屏幕」，可像 App 一样打开；首次加载后断网也能使用。
  </div>

  <div class="foot">DC Ops Platform · PWA Edition</div>
</body>
</html>
